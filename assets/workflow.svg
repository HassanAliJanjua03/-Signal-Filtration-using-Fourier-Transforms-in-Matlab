<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Noisy samples to FFT, low-pass mask, inverse FFT and filtered output"><rect width="1200" height="190" rx="14" fill="#faf7f0"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="38" font-size="24" fill="#29233a" font-weight="700" text-anchor="start">My filtering workflow</text><rect x="36" y="64" width="210" height="97" rx="8" fill="#f2ede7" stroke="#ded8e0"/><text x="49" y="87" font-size="12" fill="#cc6237" font-weight="700" text-anchor="start">01</text><text x="49" y="113" font-size="17" fill="#29233a" font-weight="700" text-anchor="start">Time signal</text><text x="49" y="136" font-size="12" fill="#665f75" font-weight="400" text-anchor="start">1,000 samples</text><path d="M248 112H262L257 108M262 112L257 116" stroke="#6941a5" fill="none" stroke-width="1.5"/><rect x="264" y="64" width="210" height="97" rx="8" fill="#f2ede7" stroke="#ded8e0"/><text x="277" y="87" font-size="12" fill="#cc6237" font-weight="700" text-anchor="start">02</text><text x="277" y="113" font-size="17" fill="#29233a" font-weight="700" text-anchor="start">FFT + shift</text><text x="277" y="136" font-size="12" fill="#665f75" font-weight="400" text-anchor="start">Centered spectrum</text><path d="M476 112H490L485 108M490 112L485 116" stroke="#6941a5" fill="none" stroke-width="1.5"/><rect x="492" y="64" width="210" height="97" rx="8" fill="#e9e1f3" stroke="#ded8e0"/><text x="505" y="87" font-size="12" fill="#cc6237" font-weight="700" text-anchor="start">03</text><text x="505" y="113" font-size="17" fill="#29233a" font-weight="700" text-anchor="start">Low-pass mask</text><text x="505" y="136" font-size="12" fill="#665f75" font-weight="400" text-anchor="start">|f| ≤ 100 Hz</text><path d="M704 112H718L713 108M718 112L713 116" stroke="#6941a5" fill="none" stroke-width="1.5"/><rect x="720" y="64" width="210" height="97" rx="8" fill="#f2ede7" stroke="#ded8e0"/><text x="733" y="87" font-size="12" fill="#cc6237" font-weight="700" text-anchor="start">04</text><text x="733" y="113" font-size="17" fill="#29233a" font-weight="700" text-anchor="start">Inverse FFT</text><text x="733" y="136" font-size="12" fill="#665f75" font-weight="400" text-anchor="start">Return to time domain</text><path d="M932 112H946L941 108M946 112L941 116" stroke="#6941a5" fill="none" stroke-width="1.5"/><rect x="948" y="64" width="210" height="97" rx="8" fill="#f2ede7" stroke="#ded8e0"/><text x="961" y="87" font-size="12" fill="#cc6237" font-weight="700" text-anchor="start">05</text><text x="961" y="113" font-size="17" fill="#29233a" font-weight="700" text-anchor="start">Filtered signal</text><text x="961" y="136" font-size="12" fill="#665f75" font-weight="400" text-anchor="start">50 Hz retained</text></g></svg>