<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">Ideal low-pass filter design used in Signals.m</title><desc id="desc">The centered frequency mask equals one from minus 100 to plus 100 hertz, zero elsewhere. The 50 hertz component is passed and the 150 hertz component is rejected.</desc>
<rect width="900" height="420" rx="14" fill="#f7fafc"/><g font-family="Arial, Helvetica, sans-serif" fill="#18324a"><text x="44" y="46" font-size="24" font-weight="700">FFT low-pass filter design</text><text x="44" y="72" font-size="14">Analytical frequency mask from Signals.m · not a measured result</text>
<rect x="372" y="108" width="156" height="214" fill="#e0f2ec"/><g stroke="#d1dde6" stroke-dasharray="4 5"><path d="M60 142H840M60 232H840"/><path d="M60 106V322M255 106V322M450 106V322M645 106V322M840 106V322"/></g><g stroke="#425d72" stroke-width="1.5"><path d="M60 106V322H840" fill="none"/></g><path d="M60 322H372V142H528V322H840" fill="none" stroke="#146b80" stroke-width="4" stroke-linejoin="round"/>
<g font-size="13"><text x="49" y="146" text-anchor="end">1</text><text x="49" y="326" text-anchor="end">0</text><text x="60" y="345" text-anchor="middle">−500</text><text x="255" y="345" text-anchor="middle">−250</text><text x="372" y="345" text-anchor="middle">−100</text><text x="450" y="345" text-anchor="middle">0</text><text x="528" y="345" text-anchor="middle">100</text><text x="645" y="345" text-anchor="middle">250</text><text x="840" y="345" text-anchor="middle">500</text><text x="450" y="377" text-anchor="middle" font-size="15">Frequency (Hz)</text><text x="25" y="230" transform="rotate(-90 25 230)" text-anchor="middle">Mask magnitude</text></g>
<circle cx="489" cy="142" r="6" fill="#157b61" stroke="white" stroke-width="2"/><path d="M489 135L545 105H640" fill="none" stroke="#157b61" stroke-width="1.5"/><text x="645" y="109" font-size="14" font-weight="700" fill="#157b61">50 Hz passed</text>
<circle cx="567" cy="322" r="6" fill="#ad4a34" stroke="white" stroke-width="2"/><path d="M567 313L608 270H700" fill="none" stroke="#ad4a34" stroke-width="1.5"/><text x="705" y="274" font-size="14" font-weight="700" fill="#ad4a34">150 Hz rejected</text>
<text x="450" y="175" font-size="12" text-anchor="middle" fill="#157b61">PASSBAND</text><text x="44" y="402" font-size="12" fill="#597082">Sampling frequency: 1,000 Hz · Cutoff: 100 Hz · Symmetric about DC</text></g>
