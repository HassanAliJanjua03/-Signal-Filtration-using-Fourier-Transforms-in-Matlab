<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-label="Ideal symmetric low-pass mask, cutoff plus and minus 100 hertz"><rect width="1200" height="350" rx="14" fill="#faf7f0"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="43" font-size="25" fill="#29233a" font-weight="700" text-anchor="start">The filter is a frequency-domain mask</text><text x="36" y="68" font-size="15" fill="#665f75" font-weight="400" text-anchor="start">H(f) = 1 for |f| ≤ 100 Hz; zero elsewhere</text><rect x="503" y="98" width="214" height="170" fill="#e9e1f3"/><path d="M75 268H503V121H717V268H1145" stroke="#6941a5" stroke-width="4" fill="none"/><path d="M75 268V275" stroke="#665f75"/><text x="75" y="294" font-size="12" fill="#665f75" font-weight="400" text-anchor="middle">-500</text><path d="M449.5 268V275" stroke="#665f75"/><text x="449.5" y="294" font-size="12" fill="#665f75" font-weight="400" text-anchor="middle">-150</text><path d="M503 268V275" stroke="#665f75"/><text x="503" y="294" font-size="12" fill="#665f75" font-weight="400" text-anchor="middle">-100</text><path d="M556.5 268V275" stroke="#665f75"/><text x="556.5" y="294" font-size="12" fill="#665f75" font-weight="400" text-anchor="middle">-50</text><path d="M610 268V275" stroke="#665f75"/><text x="610" y="294" font-size="12" fill="#665f75" font-weight="400" text-anchor="middle">0</text><path d="M663.5 268V275" stroke="#665f75"/><text x="663.5" y="294" font-size="12" fill="#665f75" font-weight="400" text-anchor="middle">50</text><path d="M717 268V275" stroke="#665f75"/><text x="717" y="294" font-size="12" fill="#665f75" font-weight="400" text-anchor="middle">100</text><path d="M770.5 268V275" stroke="#665f75"/><text x="770.5" y="294" font-size="12" fill="#665f75" font-weight="400" text-anchor="middle">150</text><path d="M1145 268V275" stroke="#665f75"/><text x="1145" y="294" font-size="12" fill="#665f75" font-weight="400" text-anchor="middle">500</text><text x="62" y="125" font-size="13" fill="#665f75" font-weight="400" text-anchor="end">1</text><text x="62" y="272" font-size="13" fill="#665f75" font-weight="400" text-anchor="end">0</text><text x="610" y="325" font-size="14" fill="#665f75" font-weight="400" text-anchor="middle">Frequency (Hz)</text><text x="610" y="154" font-size="14" fill="#6941a5" font-weight="700" text-anchor="middle">PASSBAND</text><circle cx="663.5" cy="121" r="6" fill="#247c70"/><circle cx="770.5" cy="268" r="6" fill="#cc6237"/><text x="673.5" y="105" font-size="13" fill="#247c70" font-weight="700" text-anchor="start">50 Hz passed</text><text x="780.5" y="251" font-size="13" fill="#cc6237" font-weight="700" text-anchor="start">150 Hz rejected</text></g></svg>